<!DOCTYPE html>  
<html>
<head>
<meta charset="UTF-8">
<title>For You❤️</title>

<style>
body{
margin:0;
padding:0;
overflow:hidden;
font-family:Arial;
}

/* Pages */
.page{
display:none;
width:100vw;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
background:url("background.png") no-repeat center center;
background-size:cover;
}

/* Buttons */
button{
padding:10px 20px;
margin:10px;
background:#2b11c3;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
}

/* Inputs */
input{
padding:10px;
margin:10px;
width:250px;
}

/* Glow text */
.glow{
color:#2b11c3;
animation:glow 1s infinite alternate;
}
@keyframes glow{
from{text-shadow:0 0 10px #2b11c3;}
to{text-shadow:0 0 25px #ff99aa;}
}

/* Fade */
.fade-in{
opacity:0;
animation:fadeIn 1s ease forwards;
}
@keyframes fadeIn{
to{opacity:1;}
}

/* Confetti */
.confetti{
position:absolute;
width:8px;
height:12px;
top:-20px;
animation:fall linear forwards;
}
@keyframes fall{
to{transform:translateY(100vh) rotate(360deg);}
}

/* Final page background FIXED */
#final{
color:white;
position:relative;
overflow:hidden;
background:url('img2.jpg') no-repeat center 25%; /* 👈 FIXED */
background-size:cover;
}

/* Final content */
.final-content{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
text-align:center;
width:100%;
}

/* Video */
.myVideo{
width:60%;
max-width:500px;
height:auto;
display:block;
margin:20px auto;
border-radius:12px;
}
</style>

<script>
let attempts=0;

function show(id){
document.querySelectorAll('.page').forEach(p=>p.style.display="none");
document.getElementById(id).style.display="flex";
}

window.onload=function(){
show('start');
}

function checkName(){
let name=document.getElementById("name").value.toLowerCase();
attempts++;

if(name==="deepika" || name==="nibbi"){
show('welcome');
}else{
alert("Wrong 😄 try again");
}
}

function startQuestions(){ show('q1'); }

function q1(){ show('q2'); }
function q2(){ show('q3'); }
function checkQ3(){ show('surprise'); }

function openVideo(){
show('loading');
setTimeout(()=>show('video'),2000);
}

function startPrepare(){
show('prepare');

setTimeout(()=>{
show('final');
},3000);
}

function openCapsule(){
document.getElementById("capsuleBtn").style.display="none";
document.getElementById("capsuleText").innerText=
"No matter where life takes us… you will always be my top special friend ❤️";
}
</script>

</head>

<body>

<div class="page" id="start">
<h2>Enter Password ❤️</h2>
<input id="name">
<button onclick="checkName()">Enter</button>
</div>

<div class="page" id="welcome">
<h2>Welcome 😌</h2>
<button onclick="startQuestions()">Start</button>
</div>

<div class="page" id="q1">
<h2>Who am I?</h2>
<button onclick="q1()">Best Friend</button>
</div>

<div class="page" id="q2">
<h2>What I do?</h2>
<button onclick="q2()">Make you laugh</button>
</div>

<div class="page" id="q3">
<h2>Where we met?</h2>
<input id="q3ans">
<button onclick="checkQ3()">Submit</button>
</div>

<div class="page" id="surprise">
<h2>Ready for surprise 😏</h2>
<button onclick="openVideo()">Open</button>
</div>

<div class="page" id="loading">
<h2>Loading...</h2>
</div>

<div class="page" id="video">
<h2>Special Gift 🎬</h2>
<video controls class="myVideo">
<source src="video.mp4">
</video>
<button onclick="show('notice')">Next</button>
</div>

<div class="page" id="notice">
<h2>Stay forever 😏</h2>
<button onclick="startPrepare()">Agree</button>
</div>

<div class="page" id="prepare">
<h2>Preparing something special… 😌</h2>
</div>

<div class="page" id="final">
<div class="final-content">
<button id="capsuleBtn" onclick="openCapsule()">Open it ⏳</button>
<p id="capsuleText"></p>
</div>
</div>

</body>
</html>
